flutter_native_splash:
  # Match Flutter SplashScreen backgrounds (no logo on native splash).
  color: "#F5F5F7"
  color_dark: "#120F1F"

  android: true
  ios: true
  web: false

  android_12:
    color: "#F5F5F7"
    color_dark: "#120F1F"
    # Android 12+ always shows an icon; use a transparent image to hide it.
    image: assets/images/splash_blank.png
    image_dark: assets/images/splash_blank.png
    icon_background_color: "#F5F5F7"
    icon_background_color_dark: "#120F1F"

  fullscreen: false
